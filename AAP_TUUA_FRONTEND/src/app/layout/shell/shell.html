<app-menu>
  <mat-toolbar class="shell__toolbar">
    <button
      mat-icon-button
      class="shell__menu-button"
      type="button"
      (click)="menu()?.toggleMobile()"
      aria-label="Abrir menú"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <span class="shell__spacer"></span>

    <span class="shell__user">
      <span class="shell__avatar" aria-hidden="true">{{ initial }}</span>
      <span class="shell__email">{{ user?.email }}</span>
    </span>

    <button mat-stroked-button class="shell__logout" type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Cerrar sesión
    </button>
  </mat-toolbar>

  <router-outlet />
</app-menu>
